name: Publish RunPod Chatterbox image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile.runpod
      - .github/workflows/publish-runpod.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runpod
          push: true
          tags: |
            ghcr.io/rosebludd/chatterbox-tts-runpod:latest
            ghcr.io/rosebludd/chatterbox-tts-runpod:${{ github.sha }}

      - name: Make GHCR package public (GraphQL)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          PKG_ID=$(gh api graphql -f query='
            query {
              repository(owner: "RoseBludd", name: "genius-voice-chatterbox") {
                packages(first: 20) {
                  nodes { id name }
                }
              }
            }' --jq '.data.repository.packages.nodes[] | select(.name=="chatterbox-tts-runpod" or .name=="genius-voice-chatterbox") | .id' | head -1)
          if [ -z "$PKG_ID" ]; then
            echo "Package nodes:"
            gh api graphql -f query='
              query {
                repository(owner: "RoseBludd", name: "genius-voice-chatterbox") {
                  packages(first: 20) { nodes { id name } }
                }
              }'
            exit 1
          fi
          echo "Setting public: $PKG_ID"
          gh api graphql -f query='
            mutation($id: ID!) {
              updatePackageVisibility(input: { packageId: $id, visibility: PUBLIC }) {
                clientMutationId
              }
            }' -f id="$PKG_ID"

      - name: Verify anonymous pull metadata
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://ghcr.io/v2/rosebludd/chatterbox-tts-runpod/tags/list")
          echo "GHCR tags list HTTP ${code}"
          test "${code}" = "200"
