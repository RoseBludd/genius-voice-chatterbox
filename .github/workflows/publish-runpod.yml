name: Publish RunPod Chatterbox image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile.runpod
      - .github/workflows/publish-runpod.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runpod
          push: true
          tags: |
            ghcr.io/rosebludd/chatterbox-tts-runpod:latest
            ghcr.io/rosebludd/chatterbox-tts-runpod:${{ github.sha }}

      - name: Make GHCR package public (user REST API)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          echo "User container packages:"
          gh api /user/packages?package_type=container --jq '.[].name' || true
          for PKG in chatterbox-tts-runpod genius-voice-chatterbox; do
            echo "Trying public on package: ${PKG}"
            if gh api --method PATCH "/user/packages/container/${PKG}/visibility" -f visibility=public; then
              echo "Public OK: ${PKG}"
              exit 0
            fi
          done
          echo "Failed to set any package public"
          exit 1

      - name: Verify anonymous pull metadata
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://ghcr.io/v2/rosebludd/chatterbox-tts-runpod/tags/list")
          echo "GHCR tags list HTTP ${code}"
          test "${code}" = "200"
