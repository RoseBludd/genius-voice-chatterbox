name: Publish RunPod Chatterbox image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile.runpod
      - .github/workflows/publish-runpod.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_REGISTRY_CREDENTIAL }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runpod
          push: true
          tags: |
            rosebludd/chatterbox-tts-runpod:latest
            rosebludd/chatterbox-tts-runpod:${{ github.sha }}

      - name: Verify Docker Hub tag exists
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://hub.docker.com/v2/repositories/rosebludd/chatterbox-tts-runpod/tags/latest")
          echo "Docker Hub latest tag HTTP ${code}"
          test "${code}" = "200"
