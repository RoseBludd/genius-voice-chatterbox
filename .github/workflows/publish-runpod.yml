name: Publish RunPod Chatterbox image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile.runpod
      - .github/workflows/publish-runpod.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runpod
          push: true
          tags: |
            ghcr.io/rosebludd/chatterbox-tts-runpod:latest
            ghcr.io/rosebludd/chatterbox-tts-runpod:${{ github.sha }}

      - name: Make GHCR package public (RunPod must pull without auth)
        run: gh api --method PATCH /orgs/RoseBludd/packages/container/chatterbox-tts-runpod/visibility -f visibility=public
        env:
          GH_TOKEN: ${{ github.token }}
